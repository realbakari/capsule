# Capsule configuration. Every knob Capsule exposes lives here.
# Copy, edit, and pass with --config. Absent file means built-in defaults.

[discover]
roots = ["./skills", "./packs"]

[policy]
writable_roots = ["./packs", "./outputs", "./out"]
readonly_roots = ["./skills", "./docs"]

# Both default false. Each flips a deny to an approval-required allow, and each
# flip is written to the audit log individually.
allow_restricted_reconstruction = false
allow_unaudited_registry_skills = false

# Keep the OWASP AST10 starter rules. Set false to run only your own.
use_default_rules = true

[routing]
min_score = 1.5
shortlist_size = 4

# Combined skill descriptions past this budget risk silent truncation, where
# overflow skills stop triggering with no error anywhere. Tune to your host.
description_budget = 12000

# Specialisation relationships. The skill format has no way to express that one
# skill is a narrower case of another, so overlapping skills from unrelated
# authors compete arbitrarily. Declare the relationship instead.
[[routing.precedence]]
prefer = "pdf-reading"
over = "pdf"
when = "extract"
reason = "pdf owns creation and forms; pdf-reading owns extraction"

[[routing.precedence]]
prefer = "skill-creator"
over = "web-artifacts-builder"
when = "skill"
reason = "both match on 'build'; only one authors skills"

# --- taxonomy ----------------------------------------------------------------
# Categories, intents and domains are data, not code. The built-in tables
# describe the corpus Capsule was built against; yours is almost certainly a
# different one, and new skills appear faster than any shipped table can track.
#
# Declared entries are consulted before the built-ins. Set extend_defaults to
# false to drop the built-ins entirely, which is usually right for a workspace
# that lives in one domain -- there, "spreadsheet" and "commerce" are pure noise.
#
# Domains are also derived automatically from the names in your index: a
# workspace of specs-websocket / specs-depth / specs-asr yields a `specs`
# domain with nothing declared. Declare entries when you want a label that the
# names do not spell out, such as treating "lens" and "spectacles" as one thing.

# [taxonomy]
# extend_defaults = true
#
# [[taxonomy.category]]
# name = "lens-runtime"
# keywords = ["lens", "lens studio", "spectacles", "snapchat"]
#
# [[taxonomy.domain]]
# name = "lens"
# keywords = ["lens", "spectacles", "snapchat"]
#
# [[taxonomy.intent]]
# name = "profile"
# keywords = ["profile", "trace", "benchmark", "optimize"]

# --- custom rules ------------------------------------------------------------
# Matchers are ANDed. Actions: deny | approval | flag.
# Rules escalate only: they can tighten a built-in allow, never clear a denial.

[[rules]]
id = "org-no-external-registry"
description = "This org pins skills to the local monorepo."
action = "approval"
applies_to = "registry"
reason = "external registry skills require security review before first use"
min_installs = 0

[[rules]]
id = "org-no-phone-calls"
description = "Skills that place outbound phone calls need sign-off."
action = "approval"
applies_to = "skill"
reason = "outbound telephony has cost and consent implications"
body_regex = "(place a call|dial |outbound call|phone the)"
